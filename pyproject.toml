[project]
name = "arcane-mage"
version = "5.0.0"
description = "Automation helper for Fluxnodes"
readme = "README.md"
authors = [
    { name = "David White", email = "david@runonflux.io" }
]
requires-python = ">=3.13.0"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "certifi>=2026.10.23",
    "cryptography>=46.0.6",
    "email-validator>=2.3.0",
    "keyring>=25.7.0",
    "pydantic>=2.12.5",
    "pyescrypt>=0.1.0",
    "pyrage>=1.3.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
cli = [
    "typer>=0.21.1",
]
tui = [
    "arcane-mage[cli]",
    "textual>=8.0.2",
]

[project.scripts]
arcane-mage = "arcane_mage.__main__:app"

[project.entry-points."keyring.backends"]
arcane-mage-tpm = "arcane_mage.tpm_keyring"

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[dependency-groups]
ansible = [
    "ansible-core>=2.21.5",
]
dev = [
    "pyrage-stubs>=1.4.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.2",
    "textual-dev>=1.8.0",
    "ty>=0.0.91",
    "types-aiofiles>=25.1.0.20251011",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.uv]
# The Ansible collection runs inside Ansible; ansible-core is here so ty can check it.
default-groups = ["dev", "ansible"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# An Ansible module carries DOCUMENTATION, EXAMPLES and RETURN before its imports.
"ansible_collection/**/plugins/modules/*.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"
